name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin

          - name: Windows
            os: windows-latest
            target: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      - name: Build macOS application
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Build Windows application
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muslim-zone-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/**/release/bundle/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: muslim-zone-*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        run: find release-assets -type f -print

      - name: Collect release files
        run: |
          mkdir -p release-files

          find release-assets -type f \
            \( \
              -name "*.dmg" \
              -o -name "*.exe" \
              -o -name "*.msi" \
              -o -name "*.app.tar.gz" \
              -o -name "*.app.tar.gz.sig" \
              -o -name "*.exe.sig" \
              -o -name "*.msi.sig" \
            \) \
            -exec cp {} release-files/ \;

      - name: Create latest.json
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${VERSION#v}"

          MAC_FILE=$(find release-files -type f -name "*.app.tar.gz" | head -n 1)
          MAC_SIG_FILE=$(find release-files -type f -name "*.app.tar.gz.sig" | head -n 1)

          WINDOWS_FILE=$(find release-files -type f -name "*.exe" ! -name "*.sig" | head -n 1)
          WINDOWS_SIG_FILE=$(find release-files -type f -name "*.exe.sig" | head -n 1)

          if [ -z "$MAC_FILE" ]; then
            echo "macOS updater file not found."
            exit 1
          fi

          if [ -z "$MAC_SIG_FILE" ]; then
            echo "macOS signature file not found."
            exit 1
          fi

          if [ -z "$WINDOWS_FILE" ]; then
            echo "Windows updater file not found."
            exit 1
          fi

          if [ -z "$WINDOWS_SIG_FILE" ]; then
            echo "Windows signature file not found."
            exit 1
          fi

          MAC_SIGNATURE=$(cat "$MAC_SIG_FILE")
          WINDOWS_SIGNATURE=$(cat "$WINDOWS_SIG_FILE")

          MAC_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Muslim.Zone.app.tar.gz"
          WINDOWS_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Muslim.Zone_${VERSION}_x64-setup.exe"

          cat > release-files/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Muslim Zone ${VERSION}",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIGNATURE}",
                "url": "${MAC_URL}"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIGNATURE}",
                "url": "${WINDOWS_URL}"
              }
            }
          }
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-files -type f)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${assets[@]}" \
            --title "Muslim Zone ${GITHUB_REF_NAME}" \
            --generate-notes

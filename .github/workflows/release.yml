name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin

          # Windows
          - name: Windows
            os: windows-latest
            target: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      - name: Build macOS application
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Build Windows application
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muslim-zone-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/**/release/bundle/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: muslim-zone-*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        run: find release-assets -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f)

          gh release create "${GITHUB_REF_NAME}" \
            "${assets[@]}" \
            --title "Muslim Zone ${GITHUB_REF_NAME}" \
            --generate-notes
